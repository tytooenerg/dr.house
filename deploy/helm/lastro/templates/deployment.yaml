apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lastro.fullname" . }}
  labels:
    {{- include "lastro.labels" . | nindent 4 }}
spec:
  # Pinned — see values.yaml's long comment on replicaCount for why this can't safely be
  # anything but 1 (or an int8+ input) without first migrating off SQLite.
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "lastro.selectorLabels" . | nindent 6 }}
  strategy:
    # Recreate, not RollingUpdate — with replicas: 1 and a ReadWriteOnce PVC, a rolling
    # update would try to schedule the new pod before the old one releases the volume,
    # which just hangs. Recreate accepts a short downtime window instead, which is the
    # honest tradeoff of running a single-writer SQLite-backed app in Kubernetes at all.
    type: Recreate
  template:
    metadata:
      labels:
        {{- include "lastro.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "lastro.serviceAccountName" . }}
      containers:
        - name: lastro
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if .Values.redis.enabled }}
            - name: REDIS_URL
              value: "redis://{{ include "lastro.fullname" . }}-redis:6379"
            {{- end }}
          {{- if .Values.existingSecret }}
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.timeoutSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.timeoutSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- if .Values.persistence.data.enabled }}
            - name: data
              mountPath: /app/server/data
            {{- end }}
            {{- if .Values.persistence.uploads.enabled }}
            - name: uploads
              mountPath: /app/server/uploads
            {{- end }}
      volumes:
        {{- if .Values.persistence.data.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "lastro.fullname" . }}-data
        {{- end }}
        {{- if .Values.persistence.uploads.enabled }}
        - name: uploads
          persistentVolumeClaim:
            claimName: {{ include "lastro.fullname" . }}-uploads
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
