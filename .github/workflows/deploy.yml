name: Deploy

# Publica no servidor cada commit do branch de produção que passou no CI — sem ninguém
# precisar entrar por SSH. O servidor faz o trabalho em scripts/deploy/deploy-remoto.sh; a
# chave usada aqui só consegue rodar aquele script (ver DEPLOY.md, "Deploy automático").
#
# Secrets do repositório (Settings → Secrets and variables → Actions):
#   DEPLOY_HOST         IP ou domínio do servidor
#   DEPLOY_USER         usuário SSH (ex.: root)
#   DEPLOY_SSH_KEY      chave privada gerada só para o deploy
#   DEPLOY_KNOWN_HOSTS  saída de `ssh-keyscan` do servidor — confere que é o servidor certo
# Sem esses secrets o job avisa e termina sem publicar nada.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [claude/prototype-software-transform-os4cxb]
  workflow_dispatch:
    inputs:
      sha:
        description: 'SHA completo do commit a publicar (já testado)'
        required: true

# Um deploy por vez; um segundo espera o primeiro terminar em vez de cancelar no meio de
# um docker compose.
concurrency:
  group: deploy-producao
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SHA: ${{ github.event.workflow_run.head_sha || inputs.sha }}
      HEALTH_URL: ${{ vars.DEPLOY_HEALTH_URL || 'https://app.lastrox.com.br/api/health' }}
    steps:
      - name: Conferir configuração
        id: config
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          USER_: ${{ secrets.DEPLOY_USER }}
        run: |
          if [ -z "$HOST" ] || [ -z "$KEY" ] || [ -z "$KNOWN" ] || [ -z "$USER_" ]; then
            echo "::warning::Deploy automático não configurado (faltam secrets DEPLOY_*) — nada foi publicado. Ver DEPLOY.md."
            echo "pronto=false" >> "$GITHUB_OUTPUT"
          else
            echo "pronto=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publicar ${{ env.SHA }}
        if: steps.config.outputs.pronto == 'true'
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER_: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 "$USER_@$HOST" "$SHA"

      - name: Conferir que o site respondeu
        if: steps.config.outputs.pronto == 'true'
        run: |
          for i in $(seq 1 36); do
            if curl -fsS --max-time 10 "$HEALTH_URL" > /dev/null; then
              echo "Site no ar: $HEALTH_URL"
              exit 0
            fi
            sleep 5
          done
          echo "::error::O site não respondeu em $HEALTH_URL depois do deploy"
          exit 1
