name: CI

on:
  push:
    # O branch de produção também: é dele que o servidor faz git pull, e o deploy automático
    # (deploy.yml) só publica um commit depois que este workflow passou nele.
    branches: [main, claude/prototype-software-transform-os4cxb]
  pull_request:
  # Catches the kind of drift that only shows up because real time passed, not because any
  # code changed — e.g. the seed data's vencimento dates silently going stale once the
  # wall clock caught up to them (fixed in db/data/seed.ts, see the "o que podemos
  # melhorar" README section), which no push/pull_request run could ever have caught since
  # nothing was pushed the day it broke. A scheduled run against main every night, with
  # GitHub's own default failure-email-to-watchers behavior, means that class of bug gets
  # caught by CI itself instead of by whoever next happens to run the suite by hand.
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck server
        run: npm run typecheck -w server

      - name: Typecheck client
        run: npm run typecheck -w client

      - name: Typecheck Node SDK
        run: npm run typecheck -w sdks/node

      - name: Run server test suite
        run: npm run test -w server

      - name: Run client test suite
        run: npm run test -w client

      - name: Run Node SDK test suite (real, against the actual server in-process)
        run: npm run test -w sdks/node

      - name: Install Python SDK (editable, with dev deps)
        run: pip install -e ".[dev]"
        working-directory: sdks/python

      - name: Run Python SDK test suite (real, against the actual server as a subprocess)
        run: python -m pytest -v
        working-directory: sdks/python

      - name: Build server
        run: npm run build -w server

      - name: Build client
        run: npm run build -w client

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Run E2E test suite
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  # Keeps server/src/db/migrations-postgres/ honest: scripts/postgres/generate-schema.mjs's
  # translation is only worth anything if it's actually re-verified against a real Postgres
  # whenever a migration changes, not just the one time it was done by hand (see
  # docs/postgres-migration.md and scripts/postgres/README.md). A real postgres:16 service
  # container, not a mock — the same check that was run manually while building this.
  postgres-schema-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Translate SQLite migrations to Postgres
        run: node scripts/postgres/generate-schema.mjs

      - name: Validate translated schema against a real Postgres 16
        run: bash scripts/postgres/validate-schema.sh
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres

  # Publica no servidor o commit que acabou de passar em TUDO acima — sem ninguém entrar por
  # SSH. Mora aqui, como job final do CI, e não num workflow_run separado: gatilhos
  # workflow_run só disparam a partir do branch padrão (main), e o servidor segue o branch de
  # produção. O servidor faz o trabalho em scripts/deploy/deploy-remoto.sh; a chave usada aqui
  # só consegue rodar aquele script (ver DEPLOY.md, "Deploy automático").
  #
  # Secrets do repositório (Settings → Secrets and variables → Actions):
  #   DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS
  # Sem eles o job avisa e termina sem publicar nada.
  deploy:
    needs: [build-and-test, postgres-schema-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/claude/prototype-software-transform-os4cxb'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Um deploy por vez; o próximo espera em vez de cancelar no meio de um docker compose.
    concurrency:
      group: deploy-producao
      cancel-in-progress: false
    env:
      SHA: ${{ github.sha }}
      HEALTH_URL: ${{ vars.DEPLOY_HEALTH_URL || 'https://app.lastrox.com.br/api/health' }}
    steps:
      - name: Conferir configuração
        id: config
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          USER_: ${{ secrets.DEPLOY_USER }}
        run: |
          if [ -z "$HOST" ] || [ -z "$KEY" ] || [ -z "$KNOWN" ] || [ -z "$USER_" ]; then
            echo "::warning::Deploy automático não configurado (faltam secrets DEPLOY_*) — nada foi publicado. Ver DEPLOY.md."
            echo "pronto=false" >> "$GITHUB_OUTPUT"
          else
            echo "pronto=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publicar ${{ env.SHA }}
        if: steps.config.outputs.pronto == 'true'
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER_: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 "$USER_@$HOST" "$SHA"

      - name: Conferir que o site respondeu
        if: steps.config.outputs.pronto == 'true'
        run: |
          for i in $(seq 1 36); do
            if curl -fsS --max-time 10 "$HEALTH_URL" > /dev/null; then
              echo "Site no ar: $HEALTH_URL"
              exit 0
            fi
            sleep 5
          done
          echo "::error::O site não respondeu em $HEALTH_URL depois do deploy"
          exit 1
