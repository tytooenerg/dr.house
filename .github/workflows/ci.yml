name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm install

      - name: Typecheck server
        run: npm run typecheck -w server

      - name: Typecheck client
        run: npm run typecheck -w client

      - name: Typecheck Node SDK
        run: npm run typecheck -w sdks/node

      - name: Run server test suite
        run: npm run test -w server

      - name: Run client test suite
        run: npm run test -w client

      - name: Run Node SDK test suite (real, against the actual server in-process)
        run: npm run test -w sdks/node

      - name: Install Python SDK (editable, with dev deps)
        run: pip install -e ".[dev]"
        working-directory: sdks/python

      - name: Run Python SDK test suite (real, against the actual server as a subprocess)
        run: python -m pytest -v
        working-directory: sdks/python

      - name: Build server
        run: npm run build -w server

      - name: Build client
        run: npm run build -w client

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Run E2E test suite
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
